[build-system]
requires = ["setuptools>=45", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "ideas-toolbox-caiman"
description = "IDEAS Caiman Toolbox"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3"
]
dependencies = [
    "requests==2.27.1",
    "urllib3==1.26.16",
    "configobj==5.0.8",
    "pytest==7.4.2",
    "figrid==0.1.6",
    "tabulate==0.9.0",
    "protobuf==3.20.3",
    "opencv-python==4.10.0.84",
    "hdmf==3.14.6",
    "h5py==3.11.0",
    "ipython==8.26.0",
    "ipywidgets==8.1.3",
    "matplotlib==3.9.1",
    "pims==0.7",
    "scipy==1.14.0",
    "scikit-image==0.24.0",
    "scikit-learn==1.5.1",
    "zarr==2.18.2",
    "pynwb==2.8.1",
    "ipyparallel==8.8.0",
    "peakutils==1.3.5",
    "bokeh==3.4.2",
    "holoviews==1.19.1",
    "imageio==2.35.0",
    "imageio-ffmpeg==0.4.7",
    "caiman@git+https://github.com/inscopix/CaImAn.git@v0.0.9",
    "ideas-public-python-utils @ git+https://github.com/inscopix/ideas-public-python-utils.git@8387a61240591affa64be2dd6e5f794f8b231959",
    "isx==2.1.0",
]

dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.black]
line-length = 79


[tool.interrogate]
fail-under = 100
exclude = ["setup.py", "docs", "build","tests"]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-semiprivate = true
ignore-private = true
ignore-property-decorators = true
ignore-module = true
ignore-nested-functions = true
ignore-nested-classes = true
ignore-setters = false
ignore-regex = ["^get$", "^mock_.*", ".*BaseClass.*"]
color = true