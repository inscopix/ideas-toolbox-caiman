[project]
name = "ideas-toolbox-caiman"
description = "IDEAS Caiman toolkit"
requires-python = ">=3.10,<3.11"
classifiers = [
    "Programming Language :: Python :: 3"
]
dependencies = []

dynamic = ["version"]

[tool.setuptools.packages.find]
exclude = ['data', 'outputs']

[dependency-groups]
analysis = [
    "ideas-python[analysis]==1.3.2",
    "caiman@git+https://github.com/inscopix/CaImAn.git@v0.0.9",
    "isx==2.1.0",
    "tabulate==0.9.0",
    "hdmf==3.14.6",
    "pylcs==0.1.1",
    "figrid==0.1.6",
    "tabulate==0.9.0",
    "protobuf==3.20.3",
    "opencv-python==4.10.0.84",
    "h5py==3.11.0",
    "ipython==8.26.0",
    "ipywidgets==8.1.3",
    "matplotlib==3.9.2",
    "pims==0.7",
    "scipy==1.14.0",
    "scikit-image==0.24.0",
    "scikit-learn==1.5.1",
    "zarr==2.18.2",
    "pynwb==2.8.1",
    "ipyparallel==8.8.0",
    "peakutils==1.3.5",
    "bokeh==3.4.2",
    "holoviews==1.19.1",
    "imageio==2.35.0",
    "imageio-ffmpeg==0.4.7",
    "zarr==2.18.2",
    "numcodecs==0.12.1",
    "virtualenv==21.14.13",
    "setuptools==80.9.0",
    "tensorflow",
]
test = [
    "pytest==9.0.2",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
    "pytest-order==1.3.0",
    "pytest-watch==4.2.0",
]
dev = [
    "pre-commit==4.5.1",
    "ruff==0.15.8",
]

[tool.uv]
package = false

[tool.uv.sources]
tensorflow = { path = "resources/tensorflow-2.8.0-cp310-cp310-linux_x86_64.whl" }

[tool.pytest.ini_options]
pythonpath = [
  "."
]

[tool.ruff]
# flake8-builtins (A)
# pycodestyle errors (E) and warnings (W)
# pyflakes (F)
# isort (I)
lint.select = ["A", "E", "W", "F", "I"]
show-fixes = true
line-length = 88
# Be permissive of long lines
lint.ignore = ["E501", "A005"]
target-version = "py313"
extend-exclude = ["venv", "venv_test", "venv3", ".venv"]

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.pydocstyle]
add-ignore = ["D104"]  # ignore missing package docstring to reduce noise
